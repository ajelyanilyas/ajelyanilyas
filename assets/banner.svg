<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Ilyas Ajelyan — Blue Team, Threat Detection, Incident Response">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0c1120"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="16%" r="42%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="86%" cy="92%" r="46%">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3d0ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="barHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#glowA)"/>
  <rect width="1000" height="300" fill="url(#glowB)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="60" x2="1000" y2="60"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="180" x2="1000" y2="180"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
    <line x1="550" y1="0" x2="550" y2="300"/>
    <line x1="650" y1="0" x2="650" y2="300"/>
    <line x1="850" y1="0" x2="850" y2="300"/>
  </g>

  <!-- alert-timeline bars (echoes the Nightjar dashboard) -->
  <g>
    <line x1="60" y1="286" x2="940" y2="286" stroke="#ffffff" stroke-opacity="0.06"/>
    <g opacity="0.85">
      <rect x="64"  y="270" width="20" height="16" rx="2" fill="url(#bar)"/>
      <rect x="108" y="258" width="20" height="28" rx="2" fill="url(#bar)"/>
      <rect x="152" y="274" width="20" height="12" rx="2" fill="url(#bar)"/>
      <rect x="196" y="250" width="20" height="36" rx="2" fill="url(#bar)"/>
      <rect x="240" y="264" width="20" height="22" rx="2" fill="url(#bar)"/>
      <rect x="284" y="242" width="20" height="44" rx="2" fill="url(#barHot)"/>
      <rect x="328" y="268" width="20" height="18" rx="2" fill="url(#bar)"/>
      <rect x="372" y="256" width="20" height="30" rx="2" fill="url(#bar)"/>
      <rect x="416" y="276" width="20" height="10" rx="2" fill="url(#bar)"/>
      <rect x="768" y="260" width="20" height="26" rx="2" fill="url(#bar)"/>
      <rect x="812" y="238" width="20" height="48" rx="2" fill="url(#barHot)"/>
      <rect x="856" y="266" width="20" height="20" rx="2" fill="url(#bar)"/>
      <rect x="900" y="272" width="20" height="14" rx="2" fill="url(#bar)"/>
    </g>
  </g>

  <!-- status eyebrow -->
  <g transform="translate(500,64)">
    <rect x="-128" y="-15" width="256" height="30" rx="15" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.4"/>
    <circle cx="-106" cy="0" r="4" fill="#4ade80"/>
    <text x="-90" y="4" text-anchor="start" font-family="'Consolas','SFMono-Regular',monospace"
          font-size="12" letter-spacing="2.5" fill="#a5b4fc">DETECTION ENGINEERING</text>
  </g>

  <!-- name -->
  <text x="500" y="176" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="66" font-weight="600" letter-spacing="1" fill="url(#name)">Ilyas Ajelyan</text>

  <!-- tagline -->
  <text x="500" y="212" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
        font-size="15" font-weight="400" letter-spacing="4" fill="#7f95b8">BLUE TEAM · THREAT DETECTION · INCIDENT RESPONSE</text>
</svg>
